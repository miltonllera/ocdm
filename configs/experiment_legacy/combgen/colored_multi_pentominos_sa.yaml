# @package _global_

condition_name: combgen_colored_multi_pentominos
model_name: sa
test: true

# Dataset configuration to load the custom colored multi-shape dataset
dataset:
  _target_: src.dataset.pentominos.Pentominos
  prediction_type: multi_shape
  n_shapes: 2
  num_colors: 10
  held_out_filter: "np.isin( shape , [1,2,3,4,5,6,7,8,10] ) & ( angle >= 180 )"
  filter_fn: null
  batch_size: 64
  num_workers: 16  # Force to 0 for macOS spawn start method compatibility
  path: data/datasets/pentominos/

# Model configuration
model:
  _target_: src.model.slot.SlotAutoencoder
  input_size: [3, 64, 64]  # 3 channels (RGB), 64x64 resolution

  # Encoder layers configuration
  encoder_config:
    - [conv, [32, 4, 2, 1]]
    - [relu]
    - [conv, [32, 4, 2, 1]]
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [permute, [0, 2, 3, 1]]  # Change to channel-last for position embedding
    - [posemb2d, {embed: cardinal}]
    - [flatten, [1, 2]]
    - [layer_norm, [-1]]
    - [linear, [256]]
    - [relu]

  # Decoder layers configuration
  decoder_config:
    - [spatbroad, [4, 4], {input_last: True}]  # Spatial broadcast to 4x4
    - [posemb2d, {embed: cardinal}]
    - [permute, [0, 3, 1, 2]]
    - [tconv, [64, 4, 2, 1]]
    - [relu]
    - [tconv, [32, 4, 2, 1]]
    - [relu]
    - [tconv, [32, 4, 2, 1]]
    - [relu]
    - [tconv, [4, 4, 2, 1]]  # Outputs 3 channels (RGB) + 1 mask channel = 4 channels

  # Slot Attention parameters
  n_slots: 2
  slot_size: 64
  n_iter: 3
  slot_channels: 4
  slot_hidden_size: 128
  approx_implicit_grad: false
  use_wasserstein_reg: true

# Training configuration
training:
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.001

  schedulers:
    exponential:
      _target_: src.training.scheduler.ExponentialLR
      _partial_: true
      gamma: 0.99999653  # 0.5 ** (1 / 200000)
      decay_groups: null
    warmup:
      _target_: src.training.scheduler.WarmupLR
      _partial_: true
      start_value: 0.0
      warmup_steps: 3000

  scheduling_metric: val/loss

# Trainer configuration
trainer:
  _target_: lightning.pytorch.Trainer
  max_steps: 500_000
  gradient_clip_val: 1.0
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  val_check_interval: 5000
  check_val_every_n_epoch: null
  fast_dev_run: false
  default_root_dir: ${paths.log_dir}/${condition_name}/${model_name}/${now:%Y-%m-%d}_${now:%H-%M}
