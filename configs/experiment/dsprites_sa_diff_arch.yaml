# @package _global_

# Basic settings
exp_dir: baseline
condition_name: baseline_dsprites
model_name: sa_diff_arch
test: true

dataset:
  _target_: src.dataset.dsprites.DSprites
  path: data/datasets/dsprites/dsprites_train.hdf5
  batch_size: 64
  held_out_filter: null
  rebalance_dim: null

  # Performance stuff
  num_workers: 4
  # val_split: 0.2


model:
  _target_: src.model.slot.FigureGroundAutoencoder
  input_size: [1, 64, 64]  # channels, height, width

  # Encoder layers configuration
  encoder_config:
    - [conv, [16, 4, 2, 1]]
    - [relu]
    - [conv, [32, 4, 2, 1]]
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [permute, [0, 2, 3, 1]]
    - [posemb2d, {embed: cardinal}]
    - [flatten, [1, 2]]
    - [layer_norm, [-1]]
    - [linear, [64]]
    - [relu]

  # Decoder layers configuration
  decoder_config:
    - [linear, [4024]]
    - [relu]
    - [unflatten, [1, [16, 16, 16]]]
    - [conv, [64, 1, 1, 0]]
    - [relu]
    - [tconv, [32, 4, 2, 1]]
    - [relu]
    - [tconv, [16, 4, 2, 1]]
    - [relu]
    - [conv, [3, 4, 2, 1]]

  # # Decoder layers configuration
  # decoder_config:
  #   - [spatbroad, [16, 16], {input_last: True}]
  #   - [posemb2d, {embed: cardinal}]
  #   - [permute, [0, 3, 1, 2]]
  #   - [conv, [64, 1, 1, 0]]
  #   - [relu]
  #   - [tconv, [32, 4, 2, 1]]
  #   - [relu]
  #   - [tconv, [16, 4, 2, 1]]
  #   - [relu]
  #   - [conv, [2, 1, 1, 0]]

  # Slot Attention parameters
  slot_size: 16
  n_iter: 3
  slot_channels: 1
  slot_hidden_size: 128
  approx_implicit_grad: false
  use_wasserstein_reg: false

training:
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.0004

  schedulers:
    exponential:
      _target_: src.training.scheduler.ExponentialLR
      _partial_: true
      gamma: 0.999993068552217  # 0.5 ** (1 / 100000)
      decay_groups: null
    warmup:
      _target_: src.training.scheduler.WarmupLR
      _partial_: true
      start_value: 0.0
      warmup_steps: 30_000

  scheduling_metric: val/loss


trainer:
  _target_: lightning.pytorch.Trainer
  max_steps: 100_000
  gradient_clip_val: 1.0
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  val_check_interval: 5000
  check_val_every_n_epoch: null
  fast_dev_run: false
  default_root_dir: ${paths.log_dir}/${exp_dir}/${condition_name}/${model_name}/${now:%Y-%m-%d}_${now:%H-%M}

