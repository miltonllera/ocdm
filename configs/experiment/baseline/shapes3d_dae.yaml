# @package _global_

# Basic settings
condition_name: baseline_shapes3d
model_name: dae
test: true

dataset:
  _target_: src.dataset.shapes3d.Shapes3D
  path: data/datasets/shapes3d/3dshapes.h5
  held_out_filter: null
  # color_format: rgb
  # Performance stuff
  # num_worker: 4
  # val_split: 0.2

model:
  _target_: src.model.autoencoder.DiscreteAutoencoder

  # SLATE specific params
  input_size: [3, 64, 64]  # channels, height, width
  resolution: [16, 16]
  vocab_size: 256
  token_dim: 16

  # Gumbel Softmax
  tau: 0.1
  tau_start: 1.0
  tau_steps: 30_000

  # Encoder layers configuration
  encoder_config:
    # Create 4x4 patches, which produces 16 x 16 tokens
    - [conv, [64, 4, 4, 0], {bias: false}]
    - [group_norm, [1]]
    - [relu]

    # A three layer MLP to process each patch
    - [conv, [64, 1, 1, 0], {bias: false}]
    - [group_norm, [1]]
    - [relu]

    - [conv, [64, 1, 1, 0], {bias: false}]
    - [group_norm, [1]]
    - [relu]

    - [conv, [64, 1, 1, 0], {bias: false}]
    - [group_norm, [1]]
    - [relu]

  decoder_config:
    # Three layer stack of convolutions which share information in the middle layer
    - [conv, [64, 1, 1, 0], {bias: False}]
    - [group_norm, [1]]
    - [relu]

    - [conv, [64, 3, 1, 1], {bias: False}]
    - [group_norm, [1]]
    - [relu]

    - [conv, [64, 1, 1, 0], {bias: False}]
    - [group_norm, [1]]
    - [relu]

    # Pixel shuffle for upsampling
    - [pixel_shuffle, [2], {bias: False}]

    - [conv, [64, 1, 1, 0], {bias: False}]
    - [group_norm, [1]]
    - [relu]

    - [conv, [64, 3, 1, 1], {bias: False}]
    - [group_norm, [1]]
    - [relu]

    - [conv, [64, 1, 1, 0], {bias: False}]
    - [group_norm, [1]]
    - [relu]

    - [pixel_shuffle, [2], {bias: False}]

    - [conv, [3, 1, 1, 0]]

training:
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.0003

  # schedulers:
  #   exponential:
  #     _target_: src.training.scheduler.ExponentialLR
  #     _partial_: true
  #     # gamma: 0.999993068552217  # 0.5 ** (1 / 100000)
  #     g0amma: 0.99999653  # 0.5 ** (1 / 200000)
  #     decay_groups: null
  #   warmup:
  #     _target_: src.training.scheduler.WarmupLR
  #     _partial_: true
  #     start_value: 0.0
  #     warmup_steps: 30_000

  scheduling_metric: val/loss

trainer:
  _target_: lightning.pytorch.Trainer
  max_steps: 500_000
  gradient_clip_val: 1.0
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  val_check_interval: 10_000
  check_val_every_n_epoch: null
  fast_dev_run: false
  default_root_dir: ${paths.log_dir}/${condition_name}/${model_name}/${now:%Y-%m-%d}_${now:%H-%M}

