# @package _global_

condition_name: pentomino_shape
model_name: classifier
test: true

# Dataset configuration
dataset:
  _target_: src.dataset.pentominos.Pentominos
  path: data/datasets/pentominos/
  prediction_type: classification
  val_split: 0.2

# Model configuration
model:
  _target_: src.model.regression.Regressor
  regression_type: multiclass
  n_targets: 12
  prediction_dim: 0
  input_size: [1, 64, 64]  # channels, height, width (assuming grayscale, will adapt based on data)

  # Encoder layers configuration
  backbone_config:
    - [conv, [32, 4, 2, 1]]  # 32 channels, kernel 4x4, stride 2, padding 1
    - [relu]
    - [conv, [32, 4, 2, 1]]  # 32 channels, kernel 4x4, stride 2, padding 1
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [permute, [0, 2, 3, 1]]
    - [flatten, [1]]
    - [layer_norm, [-1]]
    - [linear, [256]]
    - [relu]

# Training configuration
training:
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.0003

# Trainer configuration
trainer:
  _target_: lightning.pytorch.Trainer
  max_steps: 50_000
  gradient_clip_val: 1.0
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  val_check_interval: 5000
  check_val_every_n_epoch: null
  fast_dev_run: false
  default_root_dir: ${paths.log_dir}/${condition_name}/${model_name}/${now:%Y-%m-%d}_${now:%H-%M}
