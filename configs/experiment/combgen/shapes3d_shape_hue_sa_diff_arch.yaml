# @package _global_

# Basic settings
condition_name: combgen_shapes3d_shape_hue
model_name: sa
test: true

dataset:
  _target_: src.dataset.shapes3d.Shapes3D
  path: data/datasets/shapes3d/3dshapes.h5
  held_out_filter: "( shape == 3 ) & ( object_hue > 0.5 )"  # NOTE: parenthesis are important
  rebalance_dim: shape
  # color_format: rgb
  # Performance stuff
  # num_worker: 4
  # val_split: 0.2

model:
  _target_: src.model.slot.SlotAutoencoder
  input_size: [3, 64, 64]  # channels, height, width (RGB)

  # Encoder layers configuration
  encoder_config:
    - [conv, [64, 4, 2, 1]]  # 32 channels, kernel 4x4, stride 2, padding 1
    - [relu]
    - [conv, [64, 1, 1, 0]]
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [permute, [0, 2, 3, 1]]
    - [posemb2d, {embed: cardinal}]
    - [flatten, [1, 2]]
    - [layer_norm, [-1]]
    - [linear, [64]]
    - [relu]

  # Decoder layers configuration
  decoder_config:
    - [spatbroad, [16, 16], {input_last: True}]
    - [posemb2d, {embed: cardinal}]
    - [permute, [0, 3, 1, 2]]
    - [tconv, [64, 4, 2, 1]]
    - [relu]
    - [tconv, [64, 4, 2, 1]]
    - [relu]
    - [tconv, [4, 1, 1, 0]]

  # Slot Attention parameters
  n_slots: 4
  slot_size: 10
  n_iter: 3
  slot_channels: 1
  slot_hidden_size: 128
  approx_implicit_grad: false

training:
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.0003

  schedulers:
    exponential:
      _target_: src.training.scheduler.ExponentialLR
      _partial_: true
      gamma: 0.99999653  # 0.5 ** (1 / 200000)
      decay_groups: null
    warmup:
      _target_: src.training.scheduler.WarmupLR
      _partial_: true
      start_value: 0.0
      warmup_steps: 10_000

  scheduling_metric: val/loss

trainer:
  _target_: lightning.pytorch.Trainer
  max_steps: 500_000
  gradient_clip_val: 1.0
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  val_check_interval: 5_000
  check_val_every_n_epoch: null
  fast_dev_run: false
  default_root_dir: ${paths.log_dir}/figure1/${condition_name}/${model_name}/${now:%Y-%m-d}_${now:%H_%M}
