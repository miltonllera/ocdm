# @package _global_

# Basic settings
condition_name: combgen_pentominos_rotation
model_name: wae
test: true

# Dataset configuration
dataset:
  _target_: src.dataset.pentominos.Pentominos
  path: data/datasets/pentominos/
  prediction_type: unsupervised
  # held_out_filter: "np.isin( shape , [4, 5, 6, 8,] ) & ( angle >= 180 )"
  # held_out_filter: "(np.isin( shape , [6] ) & ( angle >= 180 )) | np.isin( shape, [0, 1, 2, 3, 4, 5] )"
  held_out_filter: "( shape == 6 ) & ( angle >= 180 )"
  rebalance_dim: shape

  # Performance stuff
  # num_worker: 4
  # val_split: 0.2

# Model configuration
model:
  _target_: src.model.vae.WassersteinMMDAE
  input_size: [1, 64, 64]  # channels, height, width (assuming grayscale, will adapt based on data)

  # Encoder layers configuration
  encoder_config:
    - [conv, [32, 4, 2, 1]]  # 32 channels, kernel 4x4, stride 2, padding 1
    - [relu]
    - [conv, [32, 4, 2, 1]]
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [flatten]
    - [linear, [256]]
    - [relu]

  # Decoder layers configuration
  decoder_config:
    - [linear, [256]]
    - [relu]
    - [unflatten, [1, [16, 4, 4]]]
    - [tconv, [64, 4, 2, 1]]
    - [relu]
    - [tconv, [32, 4, 2, 1]]
    - [relu]
    - [tconv, [32, 4, 2, 1]]
    - [relu]
    - [tconv, ["${model.input_size.0}", 4, 2, 1]]

  # WAE parameters
  latent_size: 10
  lambda1: 10.0
  lambda2: 0.001
  prior_type: norm
  prior_var: 2.0

# Training configuration
training:
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.001
    weight_decay: 0.0

  schedulers:
    warmup:
      _target_: torch.optim.lr_scheduler.LinearLR
      start_factor: 0.1
      total_iters: 1000

  scheduling_metric: val/loss

# Trainer configuration
trainer:
  _target_: lightning.pytorch.Trainer
  max_steps: 500_000
  gradient_clip_val: 1.0
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  val_check_interval: 5000
  check_val_every_n_epoch: null
  fast_dev_run: false
  default_root_dir: ${paths.log_dir}/figure2/${condition_name}/${model_name}/${now:%Y-%m-%d}_${now:%H-%M}
