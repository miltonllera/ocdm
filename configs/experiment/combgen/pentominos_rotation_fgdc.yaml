# @package _global_

condition_name: combgen_pentominos_rotation_9_shapes
model_name: fgdc
test: true

# Dataset configuration
dataset:
  _target_: src.dataset.pentominos.Pentominos
  path: data/datasets/pentominos/
  prediction_type: unsupervised
  held_out_filter: "np.isin( shape , [1,2,3,4,5,6,7,8,10] ) & ( angle >= 180 )"
  rebalance_dim: shape

# Model configuration
model:
  _target_: src.model.control.FigureGroundDecoderControl
  input_size: [1, 64, 64]  # channels, height, width

  # Encoder layers configuration
  encoder_config:
    - [conv, [32, 4, 2, 1]]  # 32 channels, kernel 4x4, stride 2, padding 1
    - [relu]
    - [conv, [32, 4, 2, 1]]  # 32 channels, kernel 4x4, stride 2, padding 1
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]

  # Decoder layers configuration
  decoder_config:
    - [linear, [256]]
    - [relu]
    - [unflatten, [1, [16, 4, 4]]]
    - [tconv, [64, 4, 2, 1]]
    - [relu]
    - [tconv, [32, 4, 2, 1]]
    - [relu]
    - [tconv, [32, 4, 2, 1]]
    - [relu]
    - [tconv, [1, 4, 2, 1]]  # Outputs 1 channel directly for reconstruction (grayscale image)

  # Figure-Ground parameters
  slot_size: 64
  n_iter: 3
  slot_channels: 1
  slot_hidden_size: 128
  approx_implicit_grad: false
  use_wasserstein_reg: true

# Training configuration
training:
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.001

  schedulers:
    exponential:
      _target_: src.training.scheduler.ExponentialLR
      _partial_: true
      gamma: 0.99999653  # 0.5 ** (1 / 200000)
      decay_groups: null
    warmup:
      _target_: src.training.scheduler.WarmupLR
      _partial_: true
      start_value: 0.0
      warmup_steps: 3_000

  scheduling_metric: val/loss

# Trainer configuration
trainer:
  _target_: lightning.pytorch.Trainer
  max_steps: 500_000
  gradient_clip_val: 1.0
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  val_check_interval: 5000
  check_val_every_n_epoch: null
  fast_dev_run: false
  default_root_dir: ${paths.log_dir}/${condition_name}/${model_name}/${now:%Y-%m-%d}_${now:%H-%M}
