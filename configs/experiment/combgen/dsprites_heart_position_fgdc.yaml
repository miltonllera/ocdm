# @package _global_

condition_name: combgen_dsprites_heart_position
model_name: fgdc
test: true

dataset:
  _target_: src.dataset.dsprites.DSprites
  path: data/datasets/dsprites/dsprites_train.hdf5
  batch_size: 64
  held_out_filter: "( shape == 3 ) & ( posX < 0.5 )"  # NOTE: parenthesis are important
  rebalance_dim: shape

  # Performance stuff
  # num_worker: 4
  # val_split: 0.2

model:
  _target_: src.model.control.FigureGroundDecoderControl
  input_size: [1, 64, 64]

  encoder_config:
    - [conv, [64, 4, 2, 1]]  # 32 channels, kernel 4x4, stride 2, padding 1
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [permute, [0, 2, 3, 1]]
    - [posemb2d, {embed: cardinal}]
    - [flatten, [1, 2]]
    - [layer_norm, [-1]]
    - [linear, [64]]
    - [relu]

  decoder_config:
    - [spatbroad, [8, 8], {input_last: True}]
    - [posemb2d, {embed: cardinal}]
    - [permute, [0, 3, 1, 2]]
    - [tconv, [64, 4, 2, 1]]
    - [relu]
    - [tconv, [64, 4, 2, 1]]
    - [relu]
    - [tconv, [1, 4, 2, 1]]

  # Figure-Ground parameters
  slot_size: 16
  n_iter: 3
  slot_channels: 1
  slot_hidden_size: 128
  approx_implicit_grad: false

training:
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.0004

  schedulers:
    exponential:
      _target_: src.training.scheduler.ExponentialLR
      _partial_: true
      gamma: 0.999993068552217  # 0.5 ** (1 / 100000)
      decay_groups: null
    warmup:
      _target_: src.training.scheduler.WarmupLR
      _partial_: true
      start_value: 0.0
      warmup_steps: 30_000

  scheduling_metric: val/loss

trainer:
  _target_: lightning.pytorch.Trainer
  max_steps: 500_000
  gradient_clip_val: 1.0
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  val_check_interval: 5000
  check_val_every_n_epoch: null
  fast_dev_run: false
  default_root_dir: ${paths.log_dir}/${condition_name}/${model_name}/${now:%Y-%m-%d}_${now:%H-%M}
