# @package _global_

# Basic settings
exp_dir: baseline
condition_name: baseline_pentominos
model_name: sa
test: true

dataset:
  _target_: src.dataset.pentominos.Pentominos
  path: data/datasets/pentominos/
  prediction_type: unsupervised
  held_out_filter: null
  rebalance_dim: null

  # Performance stuff
  num_workers: 4
  # val_split: 0.2


model:
  _target_: src.model.slot.FigureGroundAutoencoder
  input_size: [1, 64, 64]  # channels, height, width (assuming grayscale, will adapt based on data)

  # Encoder layers configuration
  encoder_config:
    - [conv, [32, 4, 2, 1]]  # 32 channels, kernel 4x4, stride 2, padding 1
    - [relu]
    - [conv, [32, 4, 2, 1]]  # 32 channels, kernel 4x4, stride 2, padding 1
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]

  # Decoder layers configuration
  decoder_config:
    - [linear, [256]]
    - [relu]
    - [unflatten, [1, [16, 4, 4]]]
    - [tconv, [64, 4, 2, 1]]
    - [relu]
    - [tconv, [32, 4, 2, 1]]
    - [relu]
    - [tconv, [32, 4, 2, 1]]
    - [relu]
    - [tconv, [2, 4, 2, 1]]

  # Slot Attention parameters
  slot_size: 64
  n_iter: 3
  slot_channels: 1
  slot_hidden_size: 128
  approx_implicit_grad: false
  use_wasserstein_reg: false


training:
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.0003

  schedulers:
    exponential:
      _target_: src.training.scheduler.ExponentialLR
      _partial_: true
      # gamma: 0.999993068552217  # 0.5 ** (1 / 100000)
      gamma: 0.99999653  # 0.5 ** (1 / 200000)
      decay_groups: null
    warmup:
      _target_: src.training.scheduler.WarmupLR
      _partial_: true
      start_value: 0.0
      warmup_steps: 3_000

  scheduling_metric: val/loss


trainer:
  _target_: lightning.pytorch.Trainer
  max_steps: 100_000
  gradient_clip_val: 1.0
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  val_check_interval: 5000
  check_val_every_n_epoch: null
  fast_dev_run: false
  default_root_dir: ${paths.log_dir}/${exp_dir}/${condition_name}/${model_name}/${now:%Y-%m-%d}_${now:%H-%M}

