# @package _global_

# Basic settings
exp_dir: baseline
condition_name: baseline_colored_multi_pentominos
model_name: sa
test: true

dataset:
  _target_: src.dataset.pentominos.Pentominos
  prediction_type: multi_shape
  n_shapes: 2
  num_colors: 10
  held_out_filter: null
  filter_fn: null
  batch_size: 256
  num_workers: 12
  path: data/datasets/pentominos/
  rebalance_dim: null

model:
  _target_: src.model.slot.SlotAutoencoder
  input_size: [3, 64, 64]  # 3 channels (RGB), 64x64 resolution

  # Encoder layers configuration
  encoder_config:
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [permute, [0, 2, 3, 1]]
    - [posemb2d, {embed: cardinal}]
    - [flatten, [1, 2]]
    - [layer_norm, [-1]]
    - [linear, [64]]
    - [relu]

  # Decoder layers configuration
  decoder_config:
    - [spatbroad, [8,8], {input_last: True}]  # Spatial broadcast to 4x4
    - [posemb2d, {embed: cardinal}]
    - [permute, [0, 3, 1, 2]]
    - [tconv, [64, 4, 2, 1]]
    - [relu]
    - [tconv, [64, 4, 2, 1]]
    - [relu]
    - [tconv, [4, 4, 2, 1]]  # Outputs 3 channels (RGB) + 1 mask channel = 4 channels

  # Slot Attention parameters
  n_slots: 2
  slot_size: 64
  n_iter: 3
  slot_channels: 4
  slot_hidden_size: 128
  approx_implicit_grad: false
  use_wasserstein_reg: false


training:
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.0004

  schedulers:
    exponential:
      _target_: src.training.scheduler.ExponentialLR
      _partial_: true
      gamma: 0.999993068552217  # 0.5 ** (1 / 100000)
      decay_groups: null
    warmup:
      _target_: src.training.scheduler.WarmupLR
      _partial_: true
      start_value: 0.0
      warmup_steps: 10_000

  scheduling_metric: val/loss


trainer:
  _target_: lightning.pytorch.Trainer
  max_steps: 200_000
  gradient_clip_val: 1.0
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  val_check_interval: 5000
  check_val_every_n_epoch: null
  fast_dev_run: false
  default_root_dir: ${paths.log_dir}/${exp_dir}/${condition_name}/${model_name}/${now:%Y-%m-%d}_${now:%H-%M-%S}

