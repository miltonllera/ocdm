# @package _global_

# Basic settings
exp_dir: baseline
condition_name: baseline_shapes3d
model_name: classifier
test: true

dataset:
  _target_: src.dataset.shapes3d.Shapes3D
  path: data/datasets/shapes3d/3dshapes.h5
  prediction_type: classification
  val_split: 0.2

  held_out_filter: null
  rebalance_dim: null
  num_workers: 4

model:
  _target_: src.model.regression.Regressor
  regression_type: multiclass
  prediction_dim: 4
  n_targets: 4
  input_size: [3, 64, 64]  # channels, height, width (assuming grayscale, will adapt based on data)

  # Encoder layers configuration
  backbone_config:
    - [conv, [32, 4, 2, 1]]  # 32 channels, kernel 4x4, stride 2, padding 1
    - [relu]
    - [conv, [32, 4, 2, 1]]  # 32 channels, kernel 4x4, stride 2, padding 1
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [conv, [64, 4, 2, 1]]
    - [relu]
    - [permute, [0, 2, 3, 1]]
    - [flatten, [1]]
    - [layer_norm, [-1]]
    - [linear, [256]]
    - [relu]


training:
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.0003


trainer:
  _target_: lightning.pytorch.Trainer
  max_steps: 100_000
  gradient_clip_val: 1.0
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  check_val_every_n_epoch: null
  val_check_interval: 5000
  fast_dev_run: false
  default_root_dir: ${paths.log_dir}/${exp_dir}/${condition_name}/${model_name}/${now:%Y-%m-%d}_${now:%H-%M}


